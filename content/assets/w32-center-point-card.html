<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jake the Wizard — The Center Point (LinkedIn static card) W32</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#d9d4c7;}
  .deck{display:flex;flex-direction:column;align-items:center;gap:32px;padding:32px;}
  .slide{width:1080px;height:1080px;box-sizing:border-box;padding:110px 96px;display:flex;flex-direction:column;position:relative;overflow:hidden;font-family:'Playfair Display',serif;}
  .ink{background:#181412;color:#F4EEE0;}
  .eb{font-family:'IM Fell English',serif;text-transform:uppercase;letter-spacing:5px;font-size:28px;color:#B8860B;}
  .hl{font-weight:900;line-height:1.06;font-size:86px;margin:44px 0 0;}
  .wax{color:#C32B39;}
  .sb{font-family:'IM Fell English',serif;font-style:italic;font-size:40px;margin-top:38px;line-height:1.32;color:#C9BFA8;}
  .rule{width:180px;height:6px;background:#C32B39;margin-top:44px;}
  .ft{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-family:'IM Fell English',serif;font-size:30px;color:#C9BFA8;padding-top:40px;}
  .seal{width:104px;height:104px;border-radius:50%;background:#C32B39;border:5px solid #D9A441;color:#F4EEE0;font-weight:700;font-size:34px;display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>
<!-- W32 LinkedIn static card — the-center-point x Myth (Contrarian POV, Tier A). Hook: The Sacred Cow.
     One quotable line only. No stat-bank numbers, no "Domino" label, no book CTA. Export the single .slide 1080x1080. -->
<div class="deck">

  <div class="slide ink">
    <div class="eb">the center point</div>
    <div class="hl">ai is not a creative.<br>it is <span class="wax">an average.</span></div>
    <div class="rule"></div>
    <div class="sb">it cannot have your idea. it can only build it. so bring one.</div>
    <div class="ft"><span>Jake Tlapek · jakethewizard.com</span><span class="seal">JtW</span></div>
  </div>

</div>
</body>
</html>
