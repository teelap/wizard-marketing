<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jake the Wizard — Facebook Ads Aren't Hard (LinkedIn static card) W30</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#d9d4c7;}
  .deck{display:flex;flex-direction:column;align-items:center;gap:32px;padding:32px;}
  .slide{width:1080px;height:1080px;box-sizing:border-box;padding:110px 96px;display:flex;flex-direction:column;position:relative;overflow:hidden;font-family:'Playfair Display',serif;}
  .ink{background:#181412;color:#F4EEE0;}
  .eb{font-family:'IM Fell English',serif;text-transform:uppercase;letter-spacing:5px;font-size:30px;color:#B8860B;}
  .hl{font-weight:900;line-height:1.06;font-size:78px;margin:40px 0 0;}
  .wax{color:#C32B39;}
  .sb{font-family:'IM Fell English',serif;font-style:italic;font-size:42px;margin-top:40px;line-height:1.34;color:#C9BFA8;}
  .ft{margin-top:auto;display:flex;align-items:center;justify-content:space-between;font-family:'IM Fell English',serif;font-size:30px;color:#C9BFA8;padding-top:40px;}
  .seal{width:110px;height:110px;border-radius:50%;background:#C32B39;border:5px solid #D9A441;color:#F4EEE0;font-weight:700;font-size:36px;display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>
<!-- W30 LinkedIn static card — facebook-ads-arent-hard x Pitfall (pairs with N-Things List text post).
     Quotable through-line on the card; the post body carries the four mistakes + blog link. Export the .slide 1080x1080. -->
<div class="deck">
  <div class="slide ink">
    <div class="eb">facebook ads aren't hard</div>
    <div class="hl">beginners don't fail<br>at the ads. they fail<br>at four <span class="wax">settings.</span></div>
    <div class="sb">underspending. targeting by income. the wrong objective. an ad that doesn't match the page it lands on. creative beats targeting. fix the four, then scale.</div>
    <div class="ft"><span>Jake the Wizard</span><span class="seal">JtW</span></div>
  </div>
</div>
</body>
</html>
