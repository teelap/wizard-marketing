name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate index.html
        run: npm run validate

      - name: Dry-run build (tolerant)
        run: npm run build
        env:
          FETCH_TIMEOUT_MS: 15000

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  link-check:
    name: Link check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-redirects 5 --accept 200,206,301,302,403,429 './**/*.html' './**/*.md'
          fail: false
